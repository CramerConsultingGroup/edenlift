name: CI Notifications

on:
  workflow_run:
    workflows: ["Build Documentation Test"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get workflow run details
        id: workflow
        run: |
          echo "status=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "run_number=${{ github.event.workflow_run.run_number }}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "author=${{ github.event.workflow_run.head_commit.author.name }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          
          # Calculate duration
          started_at="${{ github.event.workflow_run.created_at }}"
          completed_at="${{ github.event.workflow_run.updated_at }}"
          start_epoch=$(date -d "$started_at" +%s)
          end_epoch=$(date -d "$completed_at" +%s)
          duration=$((end_epoch - start_epoch))
          echo "duration=${duration}s" >> $GITHUB_OUTPUT
      
      - name: Set status emoji and message
        id: status
        run: |
          if [ "${{ steps.workflow.outputs.status }}" == "success" ]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "message=Build Succeeded" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          elif [ "${{ steps.workflow.outputs.status }}" == "failure" ]; then
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "message=Build Failed" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          else
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "message=Build ${{ steps.workflow.outputs.status }}" >> $GITHUB_OUTPUT
            echo "color=16776960" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "${{ steps.status.outputs.emoji }} *${{ steps.status.outputs.message }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.status.outputs.emoji }} *${{ steps.status.outputs.message }}*\n\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ steps.workflow.outputs.branch }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ steps.workflow.outputs.commit }}|${{ steps.workflow.outputs.commit }}>\n*Author:* ${{ steps.workflow.outputs.author }}\n*Duration:* ${{ steps.workflow.outputs.duration }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "📄 *Artifacts:* <https://github.com/${{ github.repository }}/actions/runs/${{ steps.workflow.outputs.run_id }}|View Run #${{ steps.workflow.outputs.run_number }}>"
                  }
                }
              ]
            }'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Send Discord notification
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "embeds": [{
                "title": "${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.message }}",
                "description": "Build workflow completed for **${{ github.repository }}**",
                "color": ${{ steps.status.outputs.color }},
                "fields": [
                  {
                    "name": "Branch",
                    "value": "${{ steps.workflow.outputs.branch }}",
                    "inline": true
                  },
                  {
                    "name": "Duration",
                    "value": "${{ steps.workflow.outputs.duration }}",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "[`${{ steps.workflow.outputs.commit }}`](https://github.com/${{ github.repository }}/commit/${{ steps.workflow.outputs.commit }})",
                    "inline": false
                  },
                  {
                    "name": "Author",
                    "value": "${{ steps.workflow.outputs.author }}",
                    "inline": true
                  },
                  {
                    "name": "Artifacts",
                    "value": "📄 [View Run #${{ steps.workflow.outputs.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.workflow.outputs.run_id }})",
                    "inline": false
                  }
                ],
                "timestamp": "${{ github.event.workflow_run.updated_at }}"
              }]
            }'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      - name: Log notification result
        run: |
          echo "Notification sent for workflow run ${{ steps.workflow.outputs.run_id }}"
          echo "Status: ${{ steps.workflow.outputs.status }}"
          echo "Slack notified: ${{ secrets.SLACK_WEBHOOK_URL != '' }}"
          echo "Discord notified: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}"
